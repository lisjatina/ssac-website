<!DOCTYPE html>
<html lang="lv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Komanda | Suņu Sporta Attīstības Centrs</title>

    <link rel="icon" type="image/jpeg" href="images/ssac_logo.jpg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/komanda.css">
</head>

<body>


<!-- HEADER -->

<div id="site-header"></div>


<main class="team-page">

    <!-- PAGE INTRO -->

    <section class="team-intro">

        <span class="section-label">
            SSAC
        </span>

        <h1>
            Mūsu komanda
        </h1>

        <p>
            Cilvēki un suņi, kurus vieno adžiliti,
            treniņi un prieks būt kopā.
        </p>

    </section>


    <!-- ILZĪTE UN COCO -->

    <section class="team-member">

        <div class="team-main-photo">

            <img
                    src="images/BS1A6752.jpg"
                    alt="Ilzīte un Coco"
            >

        </div>


        <div class="team-member-content">

            <div class="team-member-text">

                <span class="team-role">
                    SSAC komanda
                </span>

                <h2>
                    Ilzīte un Coco
                </h2>

                <p>
                    Ilzīte un Coco ir komanda, kurai patīk
                    izaicinājumi, kustība un kopīgs darbs.
                    Treniņos viņas soli pa solim pilnveido
                    savas prasmes un kopā dodas arī
                    sacensību trasēs.
                </p>

            </div>


            <div class="team-dog-photos">

                <img
                        src="images/BS1A6990.jpg"
                        alt="Coco"
                >

                <img
                        src="images/BS1A6794.jpg"
                        alt="Coco uz A-frame"
                >

                <img
                        src="images/BS1A6864.jpg"
                        alt="Coco uz šūpolēm"
                >

                <img
                        src="images/BS1A6924.jpg"
                        alt="Coco adžiliti trasē"
                >

            </div>

        </div>

    </section>

</main>


<!-- FOOTER -->

<div id="site-footer"></div>


<script src="js/site.js"></script>

</body>
</html>
